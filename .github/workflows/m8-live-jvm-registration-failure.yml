name: M8 desktop JVM JNI registration failure recovery

on:
  push:
    branches: [feature/android-x11-display-input]
    paths:
      - 'scripts/test_m8_renderer_live_jvm_registration_failure.cpp'
      - 'scripts/fixtures/m8-host-registered-command/**'
      - 'scripts/m8-renderer-diagnostic-registration.h'
      - 'scripts/m8-renderer-diagnostic-jni-registration-backend.h'
      - '.github/workflows/m8-live-jvm-registration-failure.yml'
  pull_request:
    paths:
      - 'scripts/test_m8_renderer_live_jvm_registration_failure.cpp'
      - 'scripts/fixtures/m8-host-registered-command/**'
      - 'scripts/m8-renderer-diagnostic-registration.h'
      - 'scripts/m8-renderer-diagnostic-jni-registration-backend.h'
      - '.github/workflows/m8-live-jvm-registration-failure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-jvm-rejected-registration:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile desktop JVM-only Java fixture
        run: |
          mkdir -p /tmp/m8-jvm-failure-classes
          javac -d /tmp/m8-jvm-failure-classes \
            scripts/fixtures/m8-host-registered-command/io/github/jdawg867/anvildesk/m8/diagnostic/M8HostRegisteredCommand.java
      - name: Compile JNI failure probe with undefined behavior checks
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -pthread -O1 -g \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -L"$JAVA_HOME/lib/server" -Wl,-rpath,"$JAVA_HOME/lib/server" \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -Wall -Wextra -Werror -pedantic \
            scripts/test_m8_renderer_live_jvm_registration_failure.cpp \
            -ljvm -o /tmp/m8-jvm-registration-failure
      - name: Validate actual JVM rejection and caller-owned exception clearing
        shell: bash
        run: |
          set -euo pipefail
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            timeout 45s /tmp/m8-jvm-registration-failure /tmp/m8-jvm-failure-classes
          echo 'M8_DESKTOP_JVM_REJECTED_REGISTRATION_RECOVERY=PASS'
          echo 'M8_ANDROID_ART_REGISTRATION_FAILURE_VERIFIED=false'
          echo 'M8_NATIVE_LOAD_AUTHORIZED=false'
