          grep -Fqx 'RUN_ID="43561562356"' scripts/verify-m8-composite-jni-test-apks.sh
          grep -Fqx 'EXPECTED_SHA="dd8009d7b5a1bc714c11feeeaedcee5bdc59c003"' scripts/verify-m8-composite-jni-test-apks.sh
          grep -Fqx 'ARTIFACT_ID="14100975634"' scripts/verify-m8-composite-jni-test-apks.sh
          grep -Fqx 'ARTIFACT_DIGEST="sha256:fe3aaac5d1ab25fa350f9321732d5e30022d06d256cde39ae5835bf663af8fc1"' scripts/verify-m8-composite-jni-test-apks.sh
          expired="$(gh api repos/jdawg867/anvildesk/actions/artifacts/14100975634 --jq '.expired')"
          if [[ "$expired" == "true" ]]; then
            echo 'M8_COMPOSITE_JNI_PINNED_PREFLIGHT_SKIPPED_EXPIRED=true'
            echo 'M8_COMPOSITE_JNI_DEVICE_EXECUTED=false'
            exit 0
          fi
          [[ "$expired" == "false" ]] || exit 1
          bash scripts/verify-m8-composite-jni-test-apks.sh --verify-artifact \
            | tee /tmp/m8-composite-jni-apk-artifact-check.txt
          grep -Fx 'M8_COMPOSITE_JNI_APK_ARTIFACT_PREFLIGHT=PASS' /tmp/m8-composite-jni-apk-artifact-check.txt
          grep -Fx 'M8_COMPOSITE_JNI_TEST_ONLY_PACKAGE_ISOLATION=PASS' /tmp/m8-composite-jni-apk-artifact-check.txt
          grep -Fx 'M8_COMPOSITE_JNI_DEVICE_EXECUTED=false' /tmp/m8-composite-jni-apk-artifact-check.txt
          grep -Fx 'M8_NATIVE_LOAD_AUTHORIZED=false' /tmp/m8-composite-jni-apk-artifact-check.txt

      - name: Build separate test-only M8 composite JNI diagnostic APK pair (not installed)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          ANVILDESK_M8_COMPOSITE_JNI_APK_BUILD: "true"
        run: |
          set -euo pipefail
          bash -n scripts/build-m8-composite-jni-test-apks.sh
          bash scripts/build-m8-composite-jni-test-apks.sh \
            | tee /tmp/m8-composite-jni-apk-build.txt
          grep -Fx 'M8_COMPOSITE_JNI_TEST_ONLY_PACKAGE_ISOLATION=PASS' /tmp/m8-composite-jni-apk-build.txt
          grep -Fx 'M8_COMPOSITE_JNI_ANDROID_EXECUTED=false' /tmp/m8-composite-jni-apk-build.txt
          grep -Fx 'M8_NATIVE_LOAD_AUTHORIZED=false' /tmp/m8-composite-jni-apk-build.txt

      - name: Retain separate test-only M8 composite JNI diagnostic APK pair
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: m8-composite-jni-diagnostic-test-apks-arm64
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build stable development debug APK
        if: github.event_name == 'push' && steps.dev_signing.outputs.available == 'true'
        env:
          ANVILDESK_DEV_KEYSTORE: ${{ steps.dev_signing.outputs.keystore_path }}
          ANVILDESK_DEV_STORE_PASSWORD: ${{ secrets.ANVILDESK_DEV_STORE_PASSWORD }}
          ANVILDESK_DEV_KEY_ALIAS: ${{ secrets.ANVILDESK_DEV_KEY_ALIAS }}
          ANVILDESK_DEV_KEY_PASSWORD: ${{ secrets.ANVILDESK_DEV_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Build non-publishable debug APK
        if: github.event_name != 'push' || steps.dev_signing.outputs.available != 'true'
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify stable development APK certificate
        if: github.event_name == 'push' && steps.dev_signing.outputs.available == 'true'
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANVILDESK_DEV_CERT_SHA256 }}
        run: |
          set -euo pipefail

          apk="app/build/outputs/apk/debug/app-debug.apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          "$apksigner" verify --verbose --print-certs "$apk"

          actual="$($apksigner verify --print-certs "$apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | tr '[:lower:]' '[:upper:]' \
            | tr -d ':[:space:]')"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" \
            | tr '[:lower:]' '[:upper:]' \
            | tr -d ':[:space:]')"

          [[ -n "$actual" ]] || { echo "Could not read APK certificate SHA-256 digest" >&2; exit 1; }
          [[ "$actual" == "$expected" ]] || {
            echo "Development signing certificate mismatch" >&2
            echo "Expected: $expected" >&2
            echo "Actual:   $actual" >&2
            exit 1
          }

          echo "Verified development certificate SHA-256: $actual"

      - name: Warn when device artifact signing is unavailable
        if: github.event_name == 'push' && steps.dev_signing.outputs.available != 'true'
        run: echo "::warning::Stable development signing secrets are not configured. The debug APK was tested but will not be published as a device-upgrade artifact."

      - name: Upload rootless runtime provenance
        uses: actions/upload-artifact@v4
        with:
          name: anvildesk-rootless-runtime-arm64
          path: |
            app/build/generated/rootless-runtime/jniLibs/arm64-v8a/libanvildesk-proot.so
            app/build/generated/rootless-runtime/jniLibs/arm64-v8a/libanvildesk-proot-loader.so
            build/rootless-runtime/provenance/SHA256SUMS
            build/rootless-runtime/provenance/SOURCE.txt
          if-no-files-found: error

      - name: Upload stable development debug APK
        if: github.event_name == 'push' && steps.dev_signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: anvildesk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
