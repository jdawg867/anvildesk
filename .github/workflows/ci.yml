name: CI

on:
  push:
    branches:
      - main
      - development
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify pinned rootless runtime sources
        run: bash scripts/fetch-rootless-runtime-source.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Build verified ARM64 rootless runtime
        run: bash scripts/build-rootless-runtime.sh

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Prepare stable development signing
        id: dev_signing
        if: github.event_name == 'push'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANVILDESK_DEV_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANVILDESK_DEV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANVILDESK_DEV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANVILDESK_DEV_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANVILDESK_DEV_CERT_SHA256 }}
        run: |
          set -euo pipefail

          if [[ -z "${KEYSTORE_B64}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Stable development signing is not configured; no device-upgrade APK will be published."
            exit 0
          fi

          : "${STORE_PASSWORD:?ANVILDESK_DEV_STORE_PASSWORD is required when ANVILDESK_DEV_KEYSTORE_B64 is set}"
          : "${KEY_ALIAS:?ANVILDESK_DEV_KEY_ALIAS is required when ANVILDESK_DEV_KEYSTORE_B64 is set}"
          : "${KEY_PASSWORD:?ANVILDESK_DEV_KEY_PASSWORD is required when ANVILDESK_DEV_KEYSTORE_B64 is set}"
          : "${EXPECTED_CERT_SHA256:?ANVILDESK_DEV_CERT_SHA256 is required when ANVILDESK_DEV_KEYSTORE_B64 is set}"

          keystore="$RUNNER_TEMP/anvildesk-development.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$keystore" >> "$GITHUB_OUTPUT"

      - name: Validate read-only production upgrade gate syntax
        run: bash -n scripts/verify-m8-production-upgrade.sh

      - name: Verify M8 isolated process remains disabled
        run: |
          python3 scripts/verify-m8-secondary-process.py \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/io/github/jdawg867/anvildesk/m8/M8X11ProcessService.java

      - name: Verify standalone M8 native callback drain (native load remains disabled)
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -pthread -O2 -Wall -Wextra -Werror \
            scripts/test_m8_native_callback_drain.cpp \
            -o /tmp/m8-test-native-callback-drain
          timeout 20s /tmp/m8-test-native-callback-drain | tee m8-native-callback-drain-test.txt
          grep -Fx 'M8_NATIVE_CALLBACK_DRAIN_SYNTHETIC_TEST=PASS' m8-native-callback-drain-test.txt
          grep -Fx 'M8_ANDROID_LOOPER_QUIESCENCE_VERIFIED=false' m8-native-callback-drain-test.txt
          grep -Fx 'M8_NATIVE_LOAD_AUTHORIZED=false' m8-native-callback-drain-test.txt

      - name: Sanitize M8 callback-drain host concurrency test
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -pthread -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Wall -Wextra -Werror \
            scripts/test_m8_native_callback_drain.cpp \
            -o /tmp/m8-test-native-callback-drain-sanitized
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            timeout 30s /tmp/m8-test-native-callback-drain-sanitized \
            | tee m8-native-callback-drain-sanitized.txt
          grep -Fx 'M8_NATIVE_CALLBACK_DRAIN_SYNTHETIC_TEST=PASS' m8-native-callback-drain-sanitized.txt
          grep -Fx 'M8_ANDROID_LOOPER_QUIESCENCE_VERIFIED=false' m8-native-callback-drain-sanitized.txt
          grep -Fx 'M8_NATIVE_LOAD_AUTHORIZED=false' m8-native-callback-drain-sanitized.txt

      - name: Verify host-only M8 callback registration lifetime model
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -pthread -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Wall -Wextra -Werror \
            scripts/test_m8_callback_registration_lifetime.cpp \
            -o /tmp/m8-test-registration-lifetime
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            timeout 30s /tmp/m8-test-registration-lifetime \
            | tee m8-callback-registration-lifetime.txt
          grep -Fx 'M8_CALLBACK_REGISTRATION_HOST_MODEL=PASS' m8-callback-registration-lifetime.txt
          grep -Fx 'M8_ANDROID_RAW_USERDATA_LIFETIME_VERIFIED=false' m8-callback-registration-lifetime.txt
          grep -Fx 'M8_ANDROID_LOOPER_QUIESCENCE_VERIFIED=false' m8-callback-registration-lifetime.txt
          grep -Fx 'M8_NATIVE_LOAD_AUTHORIZED=false' m8-callback-registration-lifetime.txt

      - name: Verify M8 renderer looper disconnect and lifecycle guards
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_m8_renderer_looper_disconnect.py' -v
          python3 -m unittest discover -s scripts -p 'test_m8_renderer_lifecycle.py' -v
          python3 -m py_compile scripts/patch-m8-renderer-looper-disconnect.py scripts/audit-m8-renderer-lifecycle.py
          grep -Fq 'M8_NATIVE_LOAD_AUTHORIZED=false' scripts/patch-m8-renderer-looper-disconnect.py
          grep -Fq 'M8_NATIVE_LOAD_AUTHORIZED=false' scripts/audit-m8-renderer-lifecycle.py

      - name: Unit tests
        run: gradle --no-daemon :core:runtime:testDebugUnitTest :app:testDebugUnitTest

      - name: Compile M8 Android instrumentation tests (no emulator execution)
        run: gradle --no-daemon :app:assembleDebugAndroidTest

      - name: Build stable development debug APK
        if: github.event_name == 'push' && steps.dev_signing.outputs.available == 'true'
        env:
          ANVILDESK_DEV_KEYSTORE: ${{ steps.dev_signing.outputs.keystore_path }}
          ANVILDESK_DEV_STORE_PASSWORD: ${{ secrets.ANVILDESK_DEV_STORE_PASSWORD }}
          ANVILDESK_DEV_KEY_ALIAS: ${{ secrets.ANVILDESK_DEV_KEY_ALIAS }}
          ANVILDESK_DEV_KEY_PASSWORD: ${{ secrets.ANVILDESK_DEV_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Build non-publishable debug APK
        if: github.event_name != 'push' || steps.dev_signing.outputs.available != 'true'
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify stable development APK certificate
        if: github.event_name == 'push' && steps.dev_signing.outputs.available == 'true'
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANVILDESK_DEV_CERT_SHA256 }}
        run: |
          set -euo pipefail

          apk="app/build/outputs/apk/debug/app-debug.apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          "$apksigner" verify --verbose --print-certs "$apk"

          actual="$($apksigner verify --print-certs "$apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | tr '[:lower:]' '[:upper:]' \
            | tr -d ':[:space:]')"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" \
            | tr '[:lower:]' '[:upper:]' \
            | tr -d ':[:space:]')"

          [[ -n "$actual" ]] || { echo "Could not read APK certificate SHA-256 digest" >&2; exit 1; }
          [[ "$actual" == "$expected" ]] || {
            echo "Development signing certificate mismatch" >&2
            echo "Expected: $expected" >&2
            echo "Actual:   $actual" >&2
            exit 1
          }

          echo "Verified development certificate SHA-256: $actual"

      - name: Warn when device artifact signing is unavailable
        if: github.event_name == 'push' && steps.dev_signing.outputs.available != 'true'
        run: echo "::warning::Stable development signing secrets are not configured. The debug APK was tested but will not be published as a device-upgrade artifact."

      - name: Upload rootless runtime provenance
        uses: actions/upload-artifact@v4
        with:
          name: anvildesk-rootless-runtime-arm64
          path: |
            app/build/generated/rootless-runtime/jniLibs/arm64-v8a/libanvildesk-proot.so
            app/build/generated/rootless-runtime/jniLibs/arm64-v8a/libanvildesk-proot-loader.so
            build/rootless-runtime/provenance/SHA256SUMS
            build/rootless-runtime/provenance/SOURCE.txt
          if-no-files-found: error

      - name: Upload stable development debug APK
        if: github.event_name == 'push' && steps.dev_signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: anvildesk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
