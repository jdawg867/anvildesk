name: M8 native handle plus Surface generation admission

on:
  push:
    branches: [feature/android-x11-display-input]
    paths:
      - 'scripts/m8-renderer-generation-operation.h'
      - 'scripts/test_m8_renderer_generation_operation.cpp'
      - 'scripts/m8-renderer-handle-registry.h'
      - 'scripts/m8-renderer-handle-session-retirement.h'
      - '.github/workflows/m8-renderer-generation-operation.yml'
  pull_request:
    paths:
      - 'scripts/m8-renderer-generation-operation.h'
      - 'scripts/test_m8_renderer_generation_operation.cpp'
      - 'scripts/m8-renderer-handle-registry.h'
      - 'scripts/m8-renderer-handle-session-retirement.h'
      - '.github/workflows/m8-renderer-generation-operation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generation-lease-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build host JNI-style generation admission test with sanitizers
        run: |
          c++ -std=c++17 -pthread -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Wall -Wextra -Werror -pedantic \
            scripts/test_m8_renderer_generation_operation.cpp \
            -o /tmp/m8-renderer-generation-operation
      - name: Test racing invalidation and stale Surface generations
        shell: bash
        run: |
          set -euo pipefail
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            timeout 30s /tmp/m8-renderer-generation-operation
          echo 'M8_NATIVE_GENERATION_ADMISSION_HOST=PASS'
          echo 'M8_LORIE_JNI_INTEGRATION_VERIFIED=false'
          echo 'M8_NATIVE_LOAD_AUTHORIZED=false'
