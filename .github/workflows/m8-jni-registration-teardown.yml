name: M8 JNI registration teardown ordering

on:
  push:
    branches: [feature/android-x11-display-input]
    paths:
      - 'scripts/m8-renderer-registration-teardown.h'
      - 'scripts/test_m8_renderer_registration_teardown.cpp'
      - 'scripts/m8-renderer-diagnostic-registration.h'
      - 'scripts/m8-renderer-handle-session-retirement.h'
      - 'scripts/m8-renderer-handle-registry.h'
      - 'scripts/m8-renderer-command-boundary.h'
      - '.github/workflows/m8-jni-registration-teardown.yml'
  pull_request:
    paths:
      - 'scripts/m8-renderer-registration-teardown.h'
      - 'scripts/test_m8_renderer_registration_teardown.cpp'
      - 'scripts/m8-renderer-diagnostic-registration.h'
      - 'scripts/m8-renderer-handle-session-retirement.h'
      - 'scripts/m8-renderer-handle-registry.h'
      - 'scripts/m8-renderer-command-boundary.h'
      - '.github/workflows/m8-jni-registration-teardown.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registration-retirement-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile registration/retirement concurrency test with sanitizers
        run: |
          c++ -std=c++17 -pthread -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Wall -Wextra -Werror -pedantic \
            scripts/test_m8_renderer_registration_teardown.cpp \
            -o /tmp/m8-registration-teardown-test
      - name: Test lease drain, failed retirement and failed JNI deregistration
        shell: bash
        run: |
          set -euo pipefail
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            timeout 30s /tmp/m8-registration-teardown-test
          echo 'M8_REGISTRATION_UNREGISTER_AFTER_LEASE_DRAIN_HOST=PASS'
          echo 'M8_REAL_ANDROID_ART_DEREGISTRATION_VERIFIED=false'
          echo 'M8_NATIVE_LOAD_AUTHORIZED=false'
