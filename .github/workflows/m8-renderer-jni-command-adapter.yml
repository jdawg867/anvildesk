name: M8 host JNI-shaped command adapter

on:
  push:
    branches: [feature/android-x11-display-input]
    paths:
      - 'scripts/m8-renderer-jni-command-adapter.h'
      - 'scripts/test_m8_renderer_jni_command_adapter.cpp'
      - 'scripts/m8-renderer-command-boundary.h'
      - 'scripts/m8-renderer-handle-registry.h'
      - '.github/workflows/m8-renderer-jni-command-adapter.yml'
  pull_request:
    paths:
      - 'scripts/m8-renderer-jni-command-adapter.h'
      - 'scripts/test_m8_renderer_jni_command_adapter.cpp'
      - 'scripts/m8-renderer-command-boundary.h'
      - 'scripts/m8-renderer-handle-registry.h'
      - '.github/workflows/m8-renderer-jni-command-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-jni-command-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile host JNI-shaped signed-input test with sanitizers
        run: |
          c++ -std=c++17 -pthread -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Wall -Wextra -Werror -pedantic \
            scripts/test_m8_renderer_jni_command_adapter.cpp \
            -o /tmp/m8-jni-command-adapter-test
      - name: Validate version, signed boundaries, leased commands and stale generations
        shell: bash
        run: |
          set -euo pipefail
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            timeout 30s /tmp/m8-jni-command-adapter-test
          echo 'M8_JNI_SHAPED_COMMAND_ADAPTER_HOST=PASS'
          echo 'M8_ACTUAL_JNI_METHOD_REGISTRATION_VERIFIED=false'
          echo 'M8_NATIVE_LOAD_AUTHORIZED=false'
