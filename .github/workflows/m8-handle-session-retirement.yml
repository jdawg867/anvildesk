name: M8 renderer handle + session retirement

on:
  push:
    branches: [feature/android-x11-display-input]
    paths:
      - 'scripts/m8-renderer-handle-registry.h'
      - 'scripts/m8-renderer-handle-session-retirement.h'
      - 'scripts/test_m8_renderer_handle_session_retirement.cpp'
      - '.github/workflows/m8-handle-session-retirement.yml'
  pull_request:
    paths:
      - 'scripts/m8-renderer-handle-registry.h'
      - 'scripts/m8-renderer-handle-session-retirement.h'
      - 'scripts/test_m8_renderer_handle_session_retirement.cpp'
      - '.github/workflows/m8-handle-session-retirement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handle-retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile host concurrency test with sanitizers
        run: |
          c++ -std=c++17 -pthread -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Wall -Wextra -Werror -pedantic \
            scripts/test_m8_renderer_handle_session_retirement.cpp \
            -o /tmp/m8-handle-session-test
      - name: Validate drain, retry, and no handle resurrection
        shell: bash
        run: |
          set -euo pipefail
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            timeout 30s /tmp/m8-handle-session-test
          echo 'M8_HANDLE_SESSION_RETIREMENT_HOST=PASS'
          echo 'M8_LORIE_NATIVE_DESTROY_WIRING_VERIFIED=false'
          echo 'M8_NATIVE_LOAD_AUTHORIZED=false'
