name: M8 restricted native command boundary

on:
  push:
    branches: [feature/android-x11-display-input]
    paths:
      - 'scripts/m8-renderer-command-boundary.h'
      - 'scripts/test_m8_renderer_command_boundary.cpp'
      - 'scripts/m8-renderer-handle-registry.h'
      - 'scripts/m8-renderer-handle-session-retirement.h'
      - '.github/workflows/m8-renderer-command-boundary.yml'
  pull_request:
    paths:
      - 'scripts/m8-renderer-command-boundary.h'
      - 'scripts/test_m8_renderer_command_boundary.cpp'
      - 'scripts/m8-renderer-handle-registry.h'
      - 'scripts/m8-renderer-handle-session-retirement.h'
      - '.github/workflows/m8-renderer-command-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restricted-native-command:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build restricted host command dispatcher with sanitizers
        run: |
          c++ -std=c++17 -pthread -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Wall -Wextra -Werror -pedantic \
            scripts/test_m8_renderer_command_boundary.cpp \
            -o /tmp/m8-renderer-command-boundary
      - name: Exercise stale handles, invalid input and retirement race
        shell: bash
        run: |
          set -euo pipefail
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            timeout 30s /tmp/m8-renderer-command-boundary
          echo 'M8_RESTRICTED_NATIVE_COMMAND_BOUNDARY_HOST=PASS'
          echo 'M8_REAL_JNI_COMMAND_DISPATCH_VERIFIED=false'
          echo 'M8_NATIVE_LOAD_AUTHORIZED=false'
