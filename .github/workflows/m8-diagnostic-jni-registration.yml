name: M8 diagnostic JNI registration rollback model

on:
  push:
    branches: [feature/android-x11-display-input]
    paths:
      - 'scripts/m8-renderer-diagnostic-registration.h'
      - 'scripts/test_m8_renderer_diagnostic_registration.cpp'
      - '.github/workflows/m8-diagnostic-jni-registration.yml'
  pull_request:
    paths:
      - 'scripts/m8-renderer-diagnostic-registration.h'
      - 'scripts/test_m8_renderer_diagnostic_registration.cpp'
      - '.github/workflows/m8-diagnostic-jni-registration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registration-rollback-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build transactional registration model with sanitizers
        run: |
          c++ -std=c++17 -pthread -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Wall -Wextra -Werror -pedantic \
            scripts/test_m8_renderer_diagnostic_registration.cpp \
            -o /tmp/m8-diagnostic-jni-registration
      - name: Check rollback, failed rollback poison and concurrent registration
        shell: bash
        run: |
          set -euo pipefail
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            timeout 30s /tmp/m8-diagnostic-jni-registration
          echo 'M8_JNI_REGISTRATION_ROLLBACK_MODEL_HOST=PASS'
          echo 'M8_ACTUAL_JNI_REGISTRATION_VERIFIED=false'
          echo 'M8_NATIVE_LOAD_AUTHORIZED=false'
