name: M8 Binder Android emulator instrumentation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-x11-display-input
    paths:
      - '.github/workflows/m8-binder-emulator.yml'
      - 'app/src/androidTest/**'
      - 'app/src/main/java/io/github/jdawg867/anvildesk/m8/M8X11ProcessService.java'
      - 'app/src/main/java/io/github/jdawg867/anvildesk/m8/M8ServiceStatusClient.java'
      - 'app/src/main/java/io/github/jdawg867/anvildesk/m8/M8ServiceProtocol.java'
      - 'app/build.gradle.kts'
      - 'scripts/verify-m8-secondary-process.py'

permissions:
  contents: read

jobs:
  android-binder-instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build pinned rootless runtime for isolated test APK
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/fetch-rootless-runtime-source.sh
          bash scripts/build-rootless-runtime.sh
      - name: Ensure service is disabled and non-exported
        run: |
          python3 scripts/verify-m8-secondary-process.py \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/io/github/jdawg867/anvildesk/m8/M8X11ProcessService.java
      - name: Enable KVM access on hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute Binder instrumentation on isolated emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest -PanvildeskM8EmulatorTests=true
      - name: Upload Android instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-binder-emulator-reports
          retention-days: 14
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
