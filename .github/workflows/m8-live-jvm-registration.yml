name: M8 disposable JVM native registration integration

on:
  push:
    branches: [feature/android-x11-display-input]
    paths:
      - 'scripts/fixtures/m8-host-registered-command/**'
      - 'scripts/test_m8_renderer_live_jvm_registration.cpp'
      - 'scripts/m8-renderer-diagnostic-jni-registration-backend.h'
      - 'scripts/m8-renderer-diagnostic-registration.h'
      - 'scripts/m8-renderer-registration-teardown.h'
      - 'scripts/m8-renderer-diagnostic-jni-command.h'
      - '.github/workflows/m8-live-jvm-registration.yml'
  pull_request:
    paths:
      - 'scripts/fixtures/m8-host-registered-command/**'
      - 'scripts/test_m8_renderer_live_jvm_registration.cpp'
      - 'scripts/m8-renderer-diagnostic-jni-registration-backend.h'
      - 'scripts/m8-renderer-diagnostic-registration.h'
      - 'scripts/m8-renderer-registration-teardown.h'
      - 'scripts/m8-renderer-diagnostic-jni-command.h'
      - '.github/workflows/m8-live-jvm-registration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-desktop-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile isolated Java native declaration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m8-jvm-classes
          javac -d /tmp/m8-jvm-classes \
            scripts/fixtures/m8-host-registered-command/io/github/jdawg867/anvildesk/m8/diagnostic/M8HostRegisteredCommand.java
      - name: Compile disposable JVM embedding probe with sanitizers
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -pthread -O1 -g -fno-omit-frame-pointer \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -L"$JAVA_HOME/lib/server" -Wl,-rpath,"$JAVA_HOME/lib/server" \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Wall -Wextra -Werror -pedantic \
            scripts/test_m8_renderer_live_jvm_registration.cpp \
            -ljvm -o /tmp/m8-live-jvm-registration
      - name: Register and retire native command on desktop JVM only
        shell: bash
        run: |
          set -euo pipefail
          ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            timeout 45s /tmp/m8-live-jvm-registration /tmp/m8-jvm-classes
          echo 'M8_REAL_DESKTOP_JVM_JNI_REGISTRATION=PASS'
          echo 'M8_ANDROID_ART_JNI_REGISTRATION_VERIFIED=false'
          echo 'M8_PRODUCTION_JNI_INTEGRATION_VERIFIED=false'
          echo 'M8_NATIVE_LOAD_AUTHORIZED=false'
