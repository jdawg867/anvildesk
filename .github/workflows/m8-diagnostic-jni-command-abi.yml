name: M8 diagnostic JNI command ABI facade

on:
  push:
    branches: [feature/android-x11-display-input]
    paths:
      - 'scripts/m8-renderer-diagnostic-jni-command.h'
      - 'scripts/test_m8_renderer_diagnostic_jni_command.cpp'
      - 'scripts/m8-renderer-jni-command-adapter.h'
      - 'scripts/m8-renderer-command-boundary.h'
      - '.github/workflows/m8-diagnostic-jni-command-abi.yml'
  pull_request:
    paths:
      - 'scripts/m8-renderer-diagnostic-jni-command.h'
      - 'scripts/test_m8_renderer_diagnostic_jni_command.cpp'
      - 'scripts/m8-renderer-jni-command-adapter.h'
      - 'scripts/m8-renderer-command-boundary.h'
      - '.github/workflows/m8-diagnostic-jni-command-abi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typed-jni-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile ABI-shaped JNI entrypoint against real JNI headers
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -pthread -O1 -g -fno-omit-frame-pointer \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Wall -Wextra -Werror -pedantic \
            scripts/test_m8_renderer_diagnostic_jni_command.cpp \
            -o /tmp/m8-diagnostic-jni-abi
      - name: Reject pending JNI exceptions and stale handles
        shell: bash
        run: |
          set -euo pipefail
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            timeout 30s /tmp/m8-diagnostic-jni-abi
          echo 'M8_DIAGNOSTIC_JNI_TYPED_ABI_HOST=PASS'
          echo 'M8_REAL_ANDROID_JNI_REGISTRATION_VERIFIED=false'
          echo 'M8_NATIVE_LOAD_AUTHORIZED=false'
