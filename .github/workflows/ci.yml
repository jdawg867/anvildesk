name: CI

on:
  push:
    branches:
      - main
      - development
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read
  actions: read # required for authenticated read-only artifact preflight

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify pinned rootless runtime sources
        run: bash scripts/fetch-rootless-runtime-source.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Build verified ARM64 rootless runtime
        run: bash scripts/build-rootless-runtime.sh

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Prepare stable development signing
        id: dev_signing
        if: github.event_name == 'push'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANVILDESK_DEV_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANVILDESK_DEV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANVILDESK_DEV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANVILDESK_DEV_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANVILDESK_DEV_CERT_SHA256 }}
        run: |
          set -euo pipefail

          if [[ -z "${KEYSTORE_B64}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Stable development signing is not configured; no device-upgrade APK will be published."
            exit 0
          fi

          : "${STORE_PASSWORD:?ANVILDESK_DEV_STORE_PASSWORD is required when ANVILDESK_DEV_KEYSTORE_B64 is set}"
          : "${KEY_ALIAS:?ANVILDESK_DEV_KEY_ALIAS is required when ANVILDESK_DEV_KEYSTORE_B64 is set}"
          : "${KEY_PASSWORD:?ANVILDESK_DEV_KEY_PASSWORD is required when ANVILDESK_DEV_KEYSTORE_B64 is set}"
          : "${EXPECTED_CERT_SHA256:?ANVILDESK_DEV_CERT_SHA256 is required when ANVILDESK_DEV_KEYSTORE_B64 is set}"

          keystore="$RUNNER_TEMP/anvildesk-development.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$keystore" >> "$GITHUB_OUTPUT"

      - name: Validate read-only production upgrade gate syntax
        run: bash -n scripts/verify-m8-production-upgrade.sh

      - name: Verify M8 isolated process remains disabled
        run: |
          python3 scripts/verify-m8-secondary-process.py \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/io/github/jdawg867/anvildesk/m8/M8X11ProcessService.java

      - name: Verify standalone M8 native callback drain (native load remains disabled)
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -pthread -O2 -Wall -Wextra -Werror \
            scripts/test_m8_native_callback_drain.cpp \
            -o /tmp/m8-test-native-callback-drain
          timeout 20s /tmp/m8-test-native-callback-drain | tee m8-native-callback-drain-test.txt
          grep -Fx 'M8_NATIVE_CALLBACK_DRAIN_SYNTHETIC_TEST=PASS' m8-native-callback-drain-test.txt
          grep -Fx 'M8_ANDROID_LOOPER_QUIESCENCE_VERIFIED=false' m8-native-callback-drain-test.txt
          grep -Fx 'M8_NATIVE_LOAD_AUTHORIZED=false' m8-native-callback-drain-test.txt

      - name: Sanitize M8 callback-drain host concurrency test
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -pthread -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Wall -Wextra -Werror \
            scripts/test_m8_native_callback_drain.cpp \
            -o /tmp/m8-test-native-callback-drain-sanitized
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            timeout 30s /tmp/m8-test-native-callback-drain-sanitized \
            | tee m8-native-callback-drain-sanitized.txt
          grep -Fx 'M8_NATIVE_CALLBACK_DRAIN_SYNTHETIC_TEST=PASS' m8-native-callback-drain-sanitized.txt
          grep -Fx 'M8_ANDROID_LOOPER_QUIESCENCE_VERIFIED=false' m8-native-callback-drain-sanitized.txt
          grep -Fx 'M8_NATIVE_LOAD_AUTHORIZED=false' m8-native-callback-drain-sanitized.txt

      - name: Verify host-only M8 callback registration lifetime model
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -pthread -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Wall -Wextra -Werror \
            scripts/test_m8_callback_registration_lifetime.cpp \
            -o /tmp/m8-test-registration-lifetime
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            timeout 30s /tmp/m8-test-registration-lifetime \
            | tee m8-callback-registration-lifetime.txt
          grep -Fx 'M8_CALLBACK_REGISTRATION_HOST_MODEL=PASS' m8-callback-registration-lifetime.txt
          grep -Fx 'M8_ANDROID_RAW_USERDATA_LIFETIME_VERIFIED=false' m8-callback-registration-lifetime.txt
          grep -Fx 'M8_ANDROID_LOOPER_QUIESCENCE_VERIFIED=false' m8-callback-registration-lifetime.txt
          grep -Fx 'M8_NATIVE_LOAD_AUTHORIZED=false' m8-callback-registration-lifetime.txt

      - name: Sanitize host-only M8 callback token registry
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -pthread -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Wall -Wextra -Werror \
            scripts/test_m8_callback_token_registry.cpp \
            -o /tmp/m8-test-callback-token-registry
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            timeout 30s /tmp/m8-test-callback-token-registry \
            | tee m8-callback-token-registry-test.txt
          grep -Fx 'M8_CALLBACK_TOKEN_REGISTRY_HOST_MODEL=PASS' m8-callback-token-registry-test.txt
          grep -Fx 'M8_ANDROID_USERDATA_TOKEN_ENCODING_VERIFIED=false' m8-callback-token-registry-test.txt
          grep -Fx 'M8_ANDROID_LOOPER_QUIESCENCE_VERIFIED=false' m8-callback-token-registry-test.txt
          grep -Fx 'M8_NATIVE_LOAD_AUTHORIZED=false' m8-callback-token-registry-test.txt

      - name: Sanitize M8 fake Android looper removal model
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -pthread -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Wall -Wextra -Werror \
            scripts/test_m8_fake_looper_removal.cpp \
            -o /tmp/m8-test-fake-looper-removal
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            timeout 30s /tmp/m8-test-fake-looper-removal \
            | tee m8-fake-looper-removal-test.txt
          grep -Fx 'M8_FAKE_LOOPER_REMOVAL_MODEL=PASS' m8-fake-looper-removal-test.txt
          grep -Fx 'M8_ANDROID_RAW_USERDATA_LIFETIME_VERIFIED=false' m8-fake-looper-removal-test.txt
          grep -Fx 'M8_ANDROID_LOOPER_QUIESCENCE_VERIFIED=false' m8-fake-looper-removal-test.txt
          grep -Fx 'M8_NATIVE_LOAD_AUTHORIZED=false' m8-fake-looper-removal-test.txt

      - name: Sanitize M8 looper teardown phase gate
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -pthread -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Wall -Wextra -Werror \
            scripts/test_m8_looper_teardown_gate.cpp \
            -o /tmp/m8-test-looper-teardown-gate
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            timeout 30s /tmp/m8-test-looper-teardown-gate \
            | tee m8-looper-teardown-gate-test.txt
          grep -Fx 'M8_LOOPER_TEARDOWN_GATE_HOST_MODEL=PASS' m8-looper-teardown-gate-test.txt
          grep -Fx 'M8_ANDROID_LOOPER_QUIESCENCE_VERIFIED=false' m8-looper-teardown-gate-test.txt
          grep -Fx 'M8_NATIVE_RESOURCE_RELEASE_AUTHORIZED=false' m8-looper-teardown-gate-test.txt
          grep -Fx 'M8_NATIVE_LOAD_AUTHORIZED=false' m8-looper-teardown-gate-test.txt

      - name: Sanitize concurrent M8 NDK coordinator with isolated host looper shim
        shell: bash
        run: |
          set -euo pipefail
          # Compile the ACTUAL adapter against a host-only test shim.
          # Real Android NDK headers are verified in the following step.
          c++ -std=c++17 -pthread -D__ANDROID__ \
            -Iscripts/m8-test-shim -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Wall -Wextra -Werror \
            scripts/test_m8_ndk_coordinator_concurrency.cpp \
            -o /tmp/m8-test-ndk-coordinator-host
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            timeout 30s /tmp/m8-test-ndk-coordinator-host \
            | tee m8-ndk-coordinator-host-test.txt
          grep -Fx 'M8_NDK_COORDINATOR_HOST_CONCURRENCY=PASS' m8-ndk-coordinator-host-test.txt
          grep -Fx 'M8_ANDROID_LOOPER_QUIESCENCE_VERIFIED=false' m8-ndk-coordinator-host-test.txt
          grep -Fx 'M8_NATIVE_LOAD_AUTHORIZED=false' m8-ndk-coordinator-host-test.txt

      - name: Sanitize host raw-userdata callback dispatch ordering
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -pthread -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Wall -Wextra -Werror \
            scripts/test_m8_raw_userdata_dispatch_order.cpp \
            -o /tmp/m8-test-raw-userdata-dispatch
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            timeout 30s /tmp/m8-test-raw-userdata-dispatch \
            | tee m8-raw-userdata-dispatch-test.txt
          grep -Fx 'M8_RAW_USERDATA_HOST_DISPATCH_ORDER=PASS' m8-raw-userdata-dispatch-test.txt
          grep -Fx 'M8_ANDROID_DISPATCH_THREAD_JOIN_VERIFIED=false' m8-raw-userdata-dispatch-test.txt
          grep -Fx 'M8_ANDROID_LOOPER_QUIESCENCE_VERIFIED=false' m8-raw-userdata-dispatch-test.txt
          grep -Fx 'M8_NATIVE_LOAD_AUTHORIZED=false' m8-raw-userdata-dispatch-test.txt

      - name: Cross-compile isolated M8 Android NDK looper ownership adapter
        shell: bash
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/27.2.12479018"
          clang="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          test -x "$clang"
          "$clang" --target=aarch64-linux-android26 -std=c++17 \
            -Wall -Wextra -Werror -fsyntax-only \
            scripts/m8-android-looper-ndk-compile.cpp
          grep -Fq 'No runtime registration, JNI loading or production integration.' \
            scripts/m8-android-looper-ndk-compile.cpp
          grep -Fq 'AddStatus add(int fd, int events, ALooper_callbackFunc callback,' \
            scripts/m8-android-looper-ndk-compile.cpp
          echo 'M8_NDK_LOOPER_REGISTRATION_SIGNATURE=PASS'
          echo 'M8_NDK_LOOPER_HEADER_COMPILE=PASS'
          echo 'M8_ANDROID_LOOPER_QUIESCENCE_VERIFIED=false'
          echo 'M8_NATIVE_LOAD_AUTHORIZED=false'

      - name: Sanitize owned-looper callback shutdown with host execution shim
        shell: bash
        run: |
          set -euo pipefail
          # Executes the actual compile-only Android class with fake NDK calls.
          # No emulator or Android runtime is exercised by this step.
          c++ -std=c++17 -pthread -D__ANDROID__ \
            -Iscripts/m8-owned-looper-test-shim -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Wall -Wextra -Werror \
            scripts/test_m8_owned_looper_host_execution.cpp \
            -o /tmp/m8-test-owned-looper-host
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            timeout 30s /tmp/m8-test-owned-looper-host \
            | tee m8-owned-looper-host-test.txt
          grep -Fx 'M8_OWNED_LOOPER_HOST_EXECUTION=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_OWNED_LOOPER_COMPETING_SHUTDOWN=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_OWNED_LOOPER_CALLBACK_WORKER_THREAD=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_OWNED_LOOPER_CALLBACK_PREPARE_THREAD_MATCH=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_OWNED_LOOPER_POST_REMOVE_EVENT_SUPPRESSED=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_OWNED_LOOPER_POST_REMOVE_REGISTRATION_REJECTED=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_OWNED_LOOPER_IDLE_SHUTDOWN=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_OWNED_LOOPER_INVALID_REGISTRATION_REJECTED=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_OWNED_LOOPER_ADD_FD_FAILURE_RECOVERY=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_OWNED_LOOPER_PREPARE_FAILURE_RECOVERY=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_OWNED_LOOPER_CALLBACK_AUTO_REMOVE=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_OWNED_LOOPER_AUTO_REMOVE_REDELIVERY_REJECTED=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_OWNED_LOOPER_REMOVE_FD_ZERO_ACCEPTED=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_OWNED_LOOPER_AUTO_REMOVE_REJOIN_IDEMPOTENT=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_OWNED_LOOPER_EXACT_REFERENCE_BALANCE=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_OWNED_LOOPER_REMOVE_FAILURE_RETAINS_REFERENCE=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_OWNED_LOOPER_REPEATED_REMOVE_FAILURE_RECOVERY=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_RENDERER_OWNERSHIP_FAKE_LOOPER_JOIN_BOUNDARY=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_RENDERER_OWNERSHIP_FAILED_REMOVE_RETRY_JOIN=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_RENDERER_UNIFIED_OWNER_FAILED_REMOVE_RETRY=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_RENDERER_UNIFIED_OWNER_CONCURRENT_CALLBACK_DRAIN=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_RENDERER_UNIFIED_OWNER_SELF_JOIN_REJECTED=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_RENDERER_WORKER_MUTEX_OPERATIONS_REJECTED=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_RENDERER_UNIFIED_OWNER_ADD_FAILURE_RECOVERY=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_RENDERER_UNIFIED_OWNER_PREPARE_FAILURE_RECOVERY=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_RENDERER_UNIFIED_OWNER_CALLBACK_AUTO_REMOVAL=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_RENDERER_UNIFIED_OWNER_IDLE_FINAL_SHUTDOWN=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_RENDERER_UNIFIED_OWNER_HEAP_USERDATA_POST_JOIN_FREE=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_RENDERER_SESSION_COMPOSITE_FAILED_REMOVE_JOIN=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_RENDERER_SESSION_COMPOSITE_AUTO_REMOVE_FRESH_GENERATION=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_RENDERER_SESSION_COMPOSITE_CONCURRENT_SELF_JOIN_GUARD=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_RENDERER_SESSION_COMPOSITE_FAILED_REMOVE_LATE_CALLBACK_REJECTED=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_RENDERER_SESSION_COMPOSITE_ADD_FAILURE_IDLE_CLOSE=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_RENDERER_COMPOSITE_JNI_SCOPE_WORKER_JOIN=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_RENDERER_COMPOSITE_JNI_ATTACH_FAILURE_FAIL_CLOSED=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_OWNED_LOOPER_SELF_JOIN_REJECTED=PASS' m8-owned-looper-host-test.txt
          grep -Fx 'M8_ANDROID_LOOPER_RUNTIME_VERIFIED=false' m8-owned-looper-host-test.txt
          grep -Fx 'M8_NATIVE_LOAD_AUTHORIZED=false' m8-owned-looper-host-test.txt

      - name: Cross-compile dedicated M8 Android looper-thread shutdown prototype
        shell: bash
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/27.2.12479018"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$bin/clang++"
          "$bin/clang++" --target=aarch64-linux-android26 \
            -std=c++17 -pthread -Wall -Wextra -Werror -fsyntax-only \
            scripts/m8-android-owned-looper-thread.cpp
          # This probe is NOT linked into the Android app or launched.
          echo 'M8_ANDROID_OWNED_LOOPER_THREAD_COMPILE=PASS'
          echo 'M8_ANDROID_CALLBACK_THREAD_RUNTIME_VERIFIED=false'
          echo 'M8_NATIVE_LOAD_AUTHORIZED=false'

      - name: Verify isolated M8 Samsung ADB runner syntax (never execute in CI)
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/run-m8-owned-looper-device-probe.sh
          grep -Fq 'RUN_ID="42711544114"' scripts/run-m8-owned-looper-device-probe.sh
          grep -Fq 'EXPECTED_SHA="871264cc1872d980b5e59f5ab71ac1a70bf7b9a5"' scripts/run-m8-owned-looper-device-probe.sh
          grep -Fq '[[ "$model" == "SM-G766U" ]]' scripts/run-m8-owned-looper-device-probe.sh
          grep -Fq 'EXPECTED_ARTIFACT_ID="13716750305"' scripts/run-m8-owned-looper-device-probe.sh
          grep -Fq 'EXPECTED_ARTIFACT_DIGEST="sha256:da3f0141f60c49d8d11ce475c3f84aee06675d207ebcd49c208a7db0ce89ed2c"' scripts/run-m8-owned-looper-device-probe.sh
          grep -Fq "readelf -l" scripts/run-m8-owned-looper-device-probe.sh
          grep -Fq 'libandroid.so' scripts/run-m8-owned-looper-device-probe.sh
          grep -Fq -- '--verify-artifact' scripts/run-m8-owned-looper-device-probe.sh
          grep -Fq 'M8_ARTIFACT_ONLY_PREFLIGHT=PASS' scripts/run-m8-owned-looper-device-probe.sh
          grep -Fq 'M8_ANDROID_DEVICE_PROBE_EXECUTED=false' scripts/run-m8-owned-looper-device-probe.sh
          grep -Fq -- '--run-on-device' scripts/run-m8-owned-looper-device-probe.sh
          echo 'M8_SAMSUNG_PROBE_RUNNER_SYNTAX=PASS'
          echo 'M8_ANDROID_DEVICE_PROBE_EXECUTED=false'

      - name: Exercise M8 artifact-only verification without ADB
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The pinned probe is a short-lived artifact. Do not fail future CI
          # after its retention expires; report the preflight as skipped.
          expired="$(gh api repos/jdawg867/anvildesk/actions/artifacts/13716750305 --jq '.expired')"
          if [[ "$expired" == "true" ]]; then
            echo 'M8_ARTIFACT_PREFLIGHT_SKIPPED_EXPIRED=true'
            exit 0
          fi
          [[ "$expired" == "false" ]] || {
            echo 'STOP: unexpected artifact expiration status' >&2
            exit 1
          }
          bash scripts/run-m8-owned-looper-device-probe.sh --verify-artifact \
            | tee m8-artifact-only-preflight.txt
          grep -Fx 'M8_ARTIFACT_ONLY_PREFLIGHT=PASS' m8-artifact-only-preflight.txt
          grep -Fx 'M8_ANDROID_DEVICE_PROBE_EXECUTED=false' m8-artifact-only-preflight.txt

      - name: Build standalone M8 owned-looper Android runtime test (not executed)
        shell: bash
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/27.2.12479018"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$bin/clang++"
          # ADB /data/local/tmp has no bundled libc++_shared.so. Link the
          # C++ runtime statically so the executable remains standalone.
          "$bin/clang++" --target=aarch64-linux-android26 \
            -std=c++17 -pthread -static-libstdc++ -O1 -Wall -Wextra -Werror \
            -Wl,--no-undefined \
            scripts/m8-android-owned-looper-device-probe.cpp \
            -landroid -o /tmp/m8-android-owned-looper-device-probe
          "$bin/llvm-readelf" -h /tmp/m8-android-owned-looper-device-probe \
            | grep -Eq 'Machine:.*AArch64'
          "$bin/llvm-readelf" -d /tmp/m8-android-owned-looper-device-probe \
            | tee /tmp/m8-owned-looper-dependencies.txt
          grep -Fq 'libandroid.so' /tmp/m8-owned-looper-dependencies.txt
          if grep -Eq 'libc\\+\\+_shared\\.so|libstdc\\+\\+\\.so|GLIBC_' \
               /tmp/m8-owned-looper-dependencies.txt; then
            echo 'STOP: Android probe depends on a non-bundled C++ runtime' >&2
            exit 1
          fi
          grep -Fq 'M8_ANDROID_LOOPER_POST_JOIN_REGISTRATION_REJECTED=PASS' \
