name: M8 handle and real retirement composition

on:
  push:
    branches: [feature/android-x11-display-input]
    paths:
      - 'scripts/m8-renderer-handle-registry.h'
      - 'scripts/m8-renderer-handle-session-retirement.h'
      - 'scripts/m8-renderer-session-retirement.h'
      - 'scripts/m8-renderer-jni-global-ref-retirement.h'
      - 'scripts/test_m8_renderer_handle_real_retirement_composition.cpp'
      - '.github/workflows/m8-handle-real-retirement-composition.yml'
  pull_request:
    paths:
      - 'scripts/m8-renderer-handle-registry.h'
      - 'scripts/m8-renderer-handle-session-retirement.h'
      - 'scripts/m8-renderer-session-retirement.h'
      - 'scripts/m8-renderer-jni-global-ref-retirement.h'
      - 'scripts/test_m8_renderer_handle_real_retirement_composition.cpp'
      - '.github/workflows/m8-handle-real-retirement-composition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composed-retirement-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile the actual coordinator classes against injected backends
        run: |
          c++ -std=c++17 -pthread -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Wall -Wextra -Werror -pedantic \
            scripts/test_m8_renderer_handle_real_retirement_composition.cpp \
            -o /tmp/m8-handle-real-retirement-test
      - name: Assert stop/join, JNI retirement and renderer ordering
        shell: bash
        run: |
          set -euo pipefail
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            timeout 30s /tmp/m8-handle-real-retirement-test
          echo 'M8_HANDLE_REAL_RETIREMENT_HOST_COMPOSITION=PASS'
          echo 'M8_LORIE_NATIVE_DESTROY_WIRING_VERIFIED=false'
          echo 'M8_NATIVE_LOAD_AUTHORIZED=false'
